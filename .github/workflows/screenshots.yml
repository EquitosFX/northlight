name: Screenshots

# Draws the app's screens with made-up content at the Shield's resolution and saves them as pictures,
# so the layout can be seen without a TV. Download them from the run's "screenshots" artifact.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Walk through the app and draw the screens
        run: ./gradlew :app:testDebugUnitTest --tests 'app.tvplayer.demo.ScreenshotTest' --stacktrace -i

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn

      # Also kept on the demo-screens branch (replaced each run), so they can be viewed on GitHub.
      - name: Save to the demo-screens branch
        if: always()
        run: |
          mkdir /tmp/screens && cp app/build/screenshots/*.png /tmp/screens/
          cd /tmp/screens
          git init -q -b demo-screens
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Screens from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" demo-screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/
