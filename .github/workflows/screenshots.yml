name: Screenshots

# Draws the app's screens with made-up content at the Shield's resolution and saves them as pictures,
# so the layout can be seen without a TV. Download them from the run's "screenshots" artifact.
on:
  push:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Draw the screens
        run: ./gradlew :app:testDebugUnitTest --tests 'app.tvplayer.demo.ScreenshotTest' --stacktrace -i

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-test-report
          path: app/build/reports/tests/
