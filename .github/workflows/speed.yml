name: Speed check

# Starts both builds of Skyfall on an Android emulator and compares how quickly they open and how
# smoothly they move. Run by hand (Actions › Speed check), or on a branch that changes the build.
on:
  workflow_dispatch:
  push:
    branches: [release-build, speed-2, perf-measure]

jobs:
  speed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: bash .github/speed.sh

  # How long each load takes with a big playlist (on the build machine, for comparing changes).
  load-times:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Time the loads
        run: |
          ./gradlew :app:testDebugUnitTest --tests 'app.tvplayer.demo.LoadTimes' -i > loadtimes.log 2>&1 || true
          grep -E "^(Filled|Load |TV guide|Player|Films|Series|Sport|Search)" loadtimes.log || true
          grep -E -A20 "loads FAILED|Exception:" loadtimes.log | head -60 || true
