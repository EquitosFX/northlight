name: Build APK

# Every push is built and tested. Pushes to main also publish the APK as the "latest" release,
# so the newest build is always at:
#   https://github.com/EquitosFX/northlight/releases/latest/download/northlight.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --stacktrace

      # The release build: runs at full speed (a debug build doesn't), signed with the same key.
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk northlight.apk
          # The startup profile as separate files (one per range of Android versions: folder 0 is for
          # Android 9-11, folder 1 for Android 12 and later). Installed alongside the APK, they let
          # Android compile Skyfall for speed while installing, instead of overnight.
          find app/build/outputs -name "*.dm" -print
          [ -f app/build/outputs/apk/release/baselineProfiles/0/app-release.dm ] && cp app/build/outputs/apk/release/baselineProfiles/0/app-release.dm northlight-28.dm
          [ -f app/build/outputs/apk/release/baselineProfiles/1/app-release.dm ] && cp app/build/outputs/apk/release/baselineProfiles/1/app-release.dm northlight-31.dm
          ls -la northlight*
          for f in northlight-*.dm; do [ -f "$f" ] && unzip -l "$f"; done; true

      - uses: actions/upload-artifact@v4
        with:
          name: northlight-apk
          path: |
            northlight.apk
            northlight-*.dm

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest northlight.apk $(ls northlight-*.dm 2>/dev/null) \
            --target "$GITHUB_SHA" \
            --title "Skyfall build $GITHUB_RUN_NUMBER" \
            --notes "Automatic build $GITHUB_RUN_NUMBER. Install northlight.apk on the Shield; it updates the copy already installed."
