name: Build APK

# Every push is built and tested. Pushes to main also publish the APK as the "latest" release,
# so the newest build is always at:
#   https://github.com/EquitosFX/northlight/releases/latest/download/northlight.apk
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core tests
        run: ./gradlew :core:test --stacktrace

      # The release build: runs at full speed (a debug build doesn't), signed with the same key.
      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk northlight.apk

      - uses: actions/upload-artifact@v4
        with:
          name: northlight-apk
          path: northlight.apk

      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest northlight.apk \
            --target "$GITHUB_SHA" \
            --title "Skyfall build $GITHUB_RUN_NUMBER" \
            --notes "Automatic build $GITHUB_RUN_NUMBER. Install northlight.apk on the Shield; it updates the copy already installed."
